apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-flask-app
  template:
    metadata:
      labels:
        app: sample-flask-app
    spec:
      containers:
        - name: sample-flask-app
          image: aayushigupta16/sample-flask-app:latest
          ports:
            - containerPort: 5000
