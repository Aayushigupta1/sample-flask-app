apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-sample-flask-app
  namespace: default
  labels:
    app: gitops-sample-flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitops-sample-flask-app
  template:
    metadata:
      labels:
        app: gitops-sample-flask-app
    spec:
      containers:
        - name: flask-app
          image: aayushigupta16/sample-flask-app:latest
          ports:
            - containerPort: 5000
